[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agentstash"
version = "0.1.0"
description = "Agent distribution CLI and internal intermediate representation for portable custom agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "tomlkit>=0.13,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "mypy>=1.13,<2", "types-PyYAML>=6.0.12,<7"]

[project.scripts]
agent-ir = "agent_ir.cli:main"
agentstash = "agent_ir.agents_cli:main"
agents = "agent_ir.agents_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_ir"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[[tool.mypy.overrides]]
module = ["yaml"]
ignore_missing_imports = true
